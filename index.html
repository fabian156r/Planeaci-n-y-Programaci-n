<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen: Planeación y Programación</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/Transfer.jpeg" type="image/png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="start-screen" class="screen active">
            <h1>Examen: Planeación y Programación</h1>
            <p>Lee con atención. Tendrás 5 segundos para leer la pregunta y 30 segundos para responder.</p>
            <div class="input-group">
                <label for="username">Nombre del Participante:</label>
                <input type="text" id="username" placeholder="Ingresa tu nombre completo..." required>
            </div>
            <button id="start-btn">Comenzar Examen</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-counter">Pregunta 1 de 10</span>
                <span id="timer-display" class="reading-mode">Preparando...</span>
            </div>
            <h2 id="question-text">¿Pregunta?</h2>
            
            <div id="reading-message">
                <p>Lee la pregunta. Las opciones aparecerán en breve...</p>
            </div>

            <div id="options-container" class="options-grid hidden">
                </div>
            <div id="feedback-message" class="feedback hidden"></div>
        </div>

        <div id="result-screen" class="screen">
            <h2>¡Examen Finalizado!</h2>
            <p id="final-score-text"></p>
            <button id="download-pdf-btn">Descargar Reporte PDF</button>
            <button id="restart-btn" class="btn-secondary">Volver a Intentar</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
